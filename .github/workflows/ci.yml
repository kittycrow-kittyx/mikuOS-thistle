name: Operating system validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate operating system
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build and validate operating system
        run: bun run build
      - name: Verify pinned kernel
        run: bash scripts/ci/verify-thistle-pin.sh
      - name: Test hosted userland
        run: bun src/test/all.ts
      - name: Test canonical kernel boot
        run: bun run test:boot
      - name: Upload Code Guards report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mikuos-code-guards
          path: logs/code-guards.json
          if-no-files-found: ignore
  clean-checkout:
    name: Validate clean checkout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Clone exact source
        env:
          TEST_REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d /tmp/mikuos-hosted.XXXXXXXX)"
          git clone --no-checkout https://github.com/kittycrow-kittyx/mikuOS-thistle.git "$work/mikuOS"
          git -C "$work/mikuOS" checkout --detach "$TEST_REV"
          git -C "$work/mikuOS" submodule update --init --recursive
          echo "MIKUOS_TMP=$work/mikuOS" >> "$GITHUB_ENV"
      - name: Build from clean checkout
        run: |
          set -Eeuo pipefail
          cd "$MIKUOS_TMP"
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          bun run test:boot
          printf 'echo MIKUOS_HOSTED_BUN\n' | timeout 180 bun mikuos.ts --kernel=thistle --no-root | tee /tmp/mikuos-hosted.log
          grep -F 'Kernel source: Thistle.' /tmp/mikuos-hosted.log
          grep -F MIKUOS_HOSTED_BUN /tmp/mikuos-hosted.log
