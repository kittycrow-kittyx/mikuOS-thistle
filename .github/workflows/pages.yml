name: Validate Thistle browser build

on:
  push:
    branches:
      - mikuOS-Thistle
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thistle-browser
  cancel-in-progress: false

jobs:
  build:
    name: Build static mikuOS
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build mikuOS
        run: bun run build

      - name: Upload Code Guards report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mikuos-pages-code-guards
          path: logs/code-guards.json
          if-no-files-found: ignore

      - name: Verify static Pages output
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s dist/web/index.html
          test -s dist/web/thistle.js
          test -s dist/web/bootloader.js
          test -s dist/web/boot-standalone.js
          test -s dist/web/root/manifest.json

          touch dist/web/.nojekyll

          echo "Static mikuOS build verified:"
          find dist/web -maxdepth 2 -type f -printf '%p\n' | sort

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: mikuos-thistle-browser
          path: dist/web
